// ═══════════════════════════════════════════════════════
// QPhysics — open-quantum-system engine (Lindblad T1 / T2)
// ═══════════════════════════════════════════════════════
// A standalone, unit-tested physics core, separable from the game UI (per the
// QuBlitz critique: replace the ad-hoc decoherence with a physically-motivated,
// verifiable model — recs #1, #2, #6). It models a single qubit as a 2×2 density
// matrix ρ and evolves it under the EXACT analytical solution of the Lindblad
// master equation for amplitude damping (T1 relaxation toward the ground state
// |0⟩) plus pure dephasing (T2). No HTML dependencies — callable + testable on
// its own (window.QPhysics / runDecoherenceDiagnostic()).
//
// Bloch convention (matches blochToState/stateToBloch and the Bloch renderer):
//   r=(x,y,z), z=+1 ↔ |0⟩ (north), z=−1 ↔ |1⟩ (south).
//   ρ = ½[[1+z, x−iy],[x+iy, 1−z]]  ⇒  ρ00=(1+z)/2, ρ11=(1−z)/2.
//   x = 2·Re(ρ01),  y = −2·Im(ρ01),  z = ρ00−ρ11,  with ρ01 = α·conj(β).
//   charge ≡ P(|1⟩) = ρ11 = (1−z)/2.
//
// Exact Lindblad solution over one step dt (relaxation toward |0⟩):
//   x(t)=x₀·e^(−dt/T2),  y(t)=y₀·e^(−dt/T2),  z(t)=1+(z₀−1)·e^(−dt/T1).
// The physical constraint T2 ≤ 2·T1 is enforced.
const QPhysics = (() => {
  const cConj = a => ({ r:a.r, i:-a.i });

  // pure spinor {alpha,beta} → Bloch vector {x,y,z}
  function blochFromPure(s) {
    const r01 = C.mul(s.alpha, cConj(s.beta));     // ρ01 = α·β*
    return { x: 2*r01.r, y: -2*r01.i, z: C.norm2(s.alpha) - C.norm2(s.beta) };
  }

  // Bloch vector → a pure spinor on the same z & azimuth. Charge (=(1−z)/2) and
  // direction are preserved exactly; this feeds the game's pure-state code paths.
  function pureFromBloch(r) {
    const theta = Math.acos(Math.max(-1, Math.min(1, r.z)));   // cosθ = z
    const phi = Math.atan2(r.y, r.x);
    return { alpha:{r:Math.cos(theta/2), i:0}, beta:C.fromPolar(Math.sin(theta/2), phi) };
  }

  const charge      = r => Math.max(0, Math.min(1, (1 - r.z) / 2));   // P(|1⟩)=ρ11
  // QB-5 — defensive interference. A GUARDing unit is measured in the X-basis,
  // so its chance of being caught excited (a CRITICAL) is P(|−⟩) = (1 − x)/2,
  // where x is the Bloch x-component set by the relative phase φ (Z/S/T) and θ.
  // This makes phase mechanically real: |+⟩ (x=+1) is crit-immune, |−⟩ (x=−1)
  // is fully exposed, |0⟩/|1⟩ (x=0) are a coin flip.
  const guardCritProb = pureOrBloch => {
    const r = ('z' in pureOrBloch) ? pureOrBloch : blochFromPure(pureOrBloch);
    return Math.max(0, Math.min(1, (1 - r.x) / 2));
  };

  // BR-3 — Pulse Forge. A resonant Rabi drive rotates the qubit around the
  // X-axis by θ = Ω_R · t (amplitude × duration, in units where θ=π is a
  // perfect flip — this is the SAME t_π = 1/(2·Ω_R/2π) relation the Qubit
  // Simulator page's own Ramsey tab already shows). rabiPopulation is the
  // textbook closed-form result for the population actually transferred to
  // |1⟩ by that rotation, independent of any starting state — it's what a
  // pulse calibrated to exactly θ=π gives 100% charge, and any other θ gives
  // a partial, testable, physically real "why did my X only charge to 87%"
  // answer instead of a made-up minigame number.
  const rabiPopulation = theta => Math.sin(theta / 2) ** 2;
  // Rotates a PURE state by θ around the Bloch X-axis — the same rotation
  // GATES.Rx/Ry already perform at their own fixed angles (π/4), generalized
  // to an arbitrary θ so Pulse Forge's slider-chosen amplitude×duration maps
  // to a real state transformation, not just the scalar population above.
  const rabiRotateState = (state, theta) => {
    const c = Math.cos(theta / 2), si = Math.sin(theta / 2);
    return {
      alpha: C.add(C.scale(state.alpha, c), C.mul({ r: 0, i: -si }, state.beta)),
      beta:  C.add(C.mul({ r: 0, i: -si }, state.alpha), C.scale(state.beta, c)),
    };
  };
  const radius      = r => Math.sqrt(r.x*r.x + r.y*r.y + r.z*r.z);    // |r|: 1 pure, 0 mixed
  const purity      = r => (1 + Math.min(1, radius(r)**2)) / 2;       // Tr(ρ²) ∈ [½,1]
  const coherenceL1 = r => Math.sqrt(r.x*r.x + r.y*r.y);              // 2|ρ01| transverse coherence

  // One exact Lindblad step toward the ground state |0⟩.
  function lindbladStep(r, { T1, T2, dt = 1 }) {
    T1 = Math.max(1e-6, T1);
    T2 = Math.max(1e-6, Math.min(T2, 2 * T1));     // enforce T2 ≤ 2·T1
    const eT2 = Math.exp(-dt / T2), eT1 = Math.exp(-dt / T1);
    return { x: r.x * eT2, y: r.y * eT2, z: 1 + (r.z - 1) * eT1 };
  }

  // ── density-matrix layer (unitary gates + self-tests) ──
  const rhoFromBloch = r =>
    [[{r:(1+r.z)/2,i:0}, {r:r.x/2,i:-r.y/2}],
     [{r:r.x/2,i:r.y/2}, {r:(1-r.z)/2,i:0}]];
  const blochFromRho = rho =>
    ({ x: 2*rho[0][1].r, y: -2*rho[0][1].i, z: rho[0][0].r - rho[1][1].r });
  // ── 2-qubit Bell pair (QB-6) ──────────────────────────────────────────────
  // A shared 4-amplitude state [c00,c01,c10,c11] for an entangled pair. This is
  // the physically-correct model: measuring one half collapses both with
  // correlated outcomes, and a LOCAL single-qubit gate on one half leaves the
  // partner's marginal statistics unchanged (no-communication theorem). The old
  // game code applied a gate to the partner directly — the #1 entanglement
  // misconception — which this replaces.
  const Bell = (() => {
    const inv2 = 1 / Math.SQRT2;
    // |Φ+⟩ = (|00⟩ + |11⟩)/√2 — the pair CNOT produces from |+⟩⊗|0⟩.
    const phiPlus = () => [ {r:inv2,i:0}, {r:0,i:0}, {r:0,i:0}, {r:inv2,i:0} ];

    // P(qubit `which` = |1⟩), marginalising over the partner.
    const marginalP1 = (a, which) =>
      which === 0 ? C.norm2(a[2]) + C.norm2(a[3])   // |10⟩,|11⟩
                  : C.norm2(a[1]) + C.norm2(a[3]);   // |01⟩,|11⟩

    // Apply a 2×2 unitary to one qubit (tensor with identity on the other).
    function applyLocal(a, which, U) {
      const [[u00,u01],[u10,u11]] = U;
      const out = a.slice();
      if (which === 0) {
        out[0] = C.add(C.mul(u00,a[0]), C.mul(u01,a[2]));
        out[2] = C.add(C.mul(u10,a[0]), C.mul(u11,a[2]));
        out[1] = C.add(C.mul(u00,a[1]), C.mul(u01,a[3]));
        out[3] = C.add(C.mul(u10,a[1]), C.mul(u11,a[3]));
      } else {
        out[0] = C.add(C.mul(u00,a[0]), C.mul(u01,a[1]));
        out[1] = C.add(C.mul(u10,a[0]), C.mul(u11,a[1]));
        out[2] = C.add(C.mul(u00,a[2]), C.mul(u01,a[3]));
        out[3] = C.add(C.mul(u10,a[2]), C.mul(u11,a[3]));
      }
      return out;
    }

    // Measure qubit `which`; return {outcome, partnerOutcome, amps} where amps is
    // the renormalised post-measurement state. `rand` is injectable for tests.
    function measure(a, which, rand = Math.random) {
      const p1 = marginalP1(a, which);
      const outcome = rand() < p1 ? 1 : 0;
      const keep = i => {
        const bit = which === 0 ? (i >> 1) & 1 : i & 1;   // i: 0..3 → bits b0 b1
        return bit === outcome;
      };
      let norm = 0;
      const out = a.map((amp, i) => keep(i) ? amp : {r:0,i:0});
      out.forEach(amp => { norm += C.norm2(amp); });
      const s = norm > 1e-12 ? 1/Math.sqrt(norm) : 0;
      const amps = out.map(amp => C.scale(amp, s));
      // Partner outcome is whatever the collapsed state now assigns it.
      const partnerOutcome = marginalP1(amps, which === 0 ? 1 : 0) > 0.5 ? 1 : 0;
      return { outcome, partnerOutcome, amps };
    }

    return { phiPlus, marginalP1, applyLocal, measure };
  })();

  // 2×2 unitary of a named game gate, derived from GATES (single source of truth):
  // U = [ GATE(|0⟩) | GATE(|1⟩) ] as columns.
  function gateMatrix(name) {
    const g = GATES[name]; if (!g) return null;
    const c0 = g({alpha:{r:1,i:0}, beta:{r:0,i:0}});
    const c1 = g({alpha:{r:0,i:0}, beta:{r:1,i:0}});
    return [[c0.alpha, c1.alpha], [c0.beta, c1.beta]];
  }
  const matMul = (A,B) => {
    const o = [[null,null],[null,null]];
    for (let i=0;i<2;i++) for (let j=0;j<2;j++)
      o[i][j] = C.add(C.mul(A[i][0],B[0][j]), C.mul(A[i][1],B[1][j]));
    return o;
  };
  const dagger = U => [[cConj(U[0][0]), cConj(U[1][0])],
                       [cConj(U[0][1]), cConj(U[1][1])]];
  // Apply a unitary gate to a Bloch vector via ρ → UρU† (valid for mixed states).
  function gateBloch(r, name) {
    const U = gateMatrix(name); if (!U) return r;
    return blochFromRho(matMul(matMul(U, rhoFromBloch(r)), dagger(U)));
  }
  // Born-rule projective measurement in the Z basis.
  const measure = r => Math.random() < charge(r)
    ? { outcome:1, bloch:{x:0,y:0,z:-1} } : { outcome:0, bloch:{x:0,y:0,z:1} };

  // Map the game's coarse decoherence rate to physical T1/T2 (in turns).
  function timesFromRate(decoRate) {
    const dr = Math.max(0.25, decoRate || 1);
    const T1 = 10 / dr;          // amplitude damping: charge relaxes ~e^(−t/T1)
    const T2 = 0.75 * T1;        // dephasing slightly faster (T2 ≤ 2·T1 ✓)
    return { T1, T2 };
  }

  // ── falsifiability harness (critique rec #2) ──
  // Prepare a unit in |1⟩, evolve N turns, fit charge-vs-turns to an exponential
  // and to a line. A physical model ⇒ R²_exp ≈ 1 ≫ R²_lin, and the fitted T1
  // recovers the input T1.
  function linregR2(xs, ys) {
    const n = xs.length;
    const mx = xs.reduce((a,b)=>a+b,0)/n, my = ys.reduce((a,b)=>a+b,0)/n;
    let sxy=0, sxx=0, syy=0;
    for (let i=0;i<n;i++){ const dx=xs[i]-mx, dy=ys[i]-my; sxy+=dx*dy; sxx+=dx*dx; syy+=dy*dy; }
    const slope = sxx ? sxy/sxx : 0;
    let ssRes=0; for (let i=0;i<n;i++){ const f=slope*xs[i]+(my-slope*mx); ssRes+=(ys[i]-f)**2; }
    return { slope, r2: syy ? 1 - ssRes/syy : 1 };
  }
  function diagnose({ decoRate = 2, turns = 20 } = {}) {
    const { T1, T2 } = timesFromRate(decoRate);
    let r = { x:0, y:0, z:-1 };                  // start fully excited |1⟩
    const t=[], q=[], lnq=[];
    for (let k=0;k<=turns;k++){
      const c = charge(r); t.push(k); q.push(c);
      if (c > 1e-9) lnq.push(Math.log(c));
      r = lindbladStep(r, { T1, T2, dt:1 });
    }
    const expFit = linregR2(t.slice(0, lnq.length), lnq);   // ln(q) vs t
    const linFit = linregR2(t, q);                          // q vs t
    const report = {
      model:'Lindblad amplitude damping', decoRate, T1, T2,
      R2_exponential:+expFit.r2.toFixed(5), R2_linear:+linFit.r2.toFixed(5),
      T1_input:+T1.toFixed(3), T1_recovered:+(expFit.slope?-1/expFit.slope:Infinity).toFixed(3),
      verdict: expFit.r2 > linFit.r2 ? 'EXPONENTIAL (physical) ✓' : 'LINEAR (non-physical) ✗',
      charge_by_turn: q.map(v=>+v.toFixed(4)),
    };
    if (typeof console!=='undefined' && console.table)
      console.table({ R2_exp:report.R2_exponential, R2_lin:report.R2_linear,
                      T1_in:report.T1_input, T1_fit:report.T1_recovered, verdict:report.verdict });
    return report;
  }

  function selfTest() {
    const approx=(a,b,e=1e-9)=>Math.abs(a-b)<=e;
    const Z0={x:0,y:0,z:1};
    const hp=gateBloch(Z0,'H');
    const T1=5,T2=3;
    const r1=lindbladStep({x:0,y:0,z:-1},{T1,T2,dt:1});   // |1⟩ → one step
    const rp=lindbladStep({x:1,y:0,z:0},{T1,T2,dt:1});    // |+⟩ → one step
    const clamp=lindbladStep({x:1,y:0,z:0},{T1:2,T2:99,dt:1});
    const tests=[
      ['H|0⟩→|+⟩ (z=0,x=1)', approx(hp.z,0)&&approx(hp.x,1)],
      ['X|0⟩→|1⟩ (z=−1)',     approx(gateBloch(Z0,'X').z,-1)],
      ['Z preserves z',        approx(gateBloch(Z0,'Z').z,1)],
      ['charge(|1⟩)=1',        approx(charge({x:0,y:0,z:-1}),1)],
      ['charge(|+⟩)=½',        approx(charge(hp),0.5)],
      ['charge relaxes e^(−1/T1)', approx(charge(r1),Math.exp(-1/T1))],
      ['transverse decays e^(−1/T2)', approx(coherenceL1(rp),Math.exp(-1/T2))],
      ['T2 clamped to 2·T1',   clamp.x<=Math.exp(-1/(2*2))+1e-9],
    ];
    const passed=tests.filter(([,v])=>v).length;
    const fails=tests.filter(([,v])=>!v).map(([n])=>n);
    (passed===tests.length?console.log:console.error)
      (`QPhysics self-test: ${passed}/${tests.length} passed`+(fails.length?` — FAILED: ${fails.join('; ')}`:' ✓'));
    return { pass:passed===tests.length, tests };
  }

  return { blochFromPure, pureFromBloch, charge, guardCritProb, radius, purity, coherenceL1,
           lindbladStep, gateBloch, gateMatrix, rhoFromBloch, blochFromRho, Bell,
           measure, timesFromRate, diagnose, selfTest, rabiPopulation, rabiRotateState };
})();
if (typeof window !== 'undefined') {
  window.QPhysics = QPhysics;
  window.runDecoherenceDiagnostic = o => QPhysics.diagnose(o);
  try { QPhysics.selfTest(); } catch (e) { console.error('QPhysics self-test threw', e); }
}

// ═══════════════════════════════════════════════════════
// DuelCore — pure, DOM-free rules engine for Photon Duel (PD-2).
// ═══════════════════════════════════════════════════════
// Photon Duel's premise: a ship's health bar IS its qubit's Bloch vector.
// Beams are gate rotations, MEASURE is a Born-rule collapse, and idling
// decoheres you. So every number below has to come from the SAME engine the
// campaign uses — this module is the bridge, not a second physics.
//
// The one thing that is NOT a direct QPhysics call is rotateBloch(). QPhysics
// rotates pure spinors (rabiRotateState); a duel qubit is an OPEN system that
// decoheres mid-round, so its state is a Bloch vector with |r| < 1 that no
// spinor can represent. rotateBloch is the same unitary generalized to that
// vector — a right-handed Rodrigues rotation about the axis — and
// tests/duel_harness.test.js case 1b asserts it agrees with
// QPhysics.rabiRotateState to ~1e-16 on pure states, i.e. it is the engine's
// own rotation, extended to mixed states, not a hand-rolled approximation.
//
// Times are in SECONDS here (real-time duel), unlike the campaign's per-turn
// steps — decayStep converts before calling QPhysics.lindbladStep.
const DuelCore = (() => {
  // §3 tuning constants. "v1 tuning starts, not law" per the design doc.
  const K = {
    CHARGE_FULL_S: 1.2,       // hold time that reaches θ=π
    BEAM_SPEED:    700,       // world units / s
    BEAM_W:        6,
    BEAM_CD_S:     0.45,
    MEASURE_SPEED: 420,
    MEASURE_CD_S:  6,
    MEASURE_WIND_S: 1,        // telegraph before it launches
    SHIP_MAX_SPD:  260,
    SHIP_ACCEL:    900,
    SHIP_FRICTION: 0.92,      // per 60Hz frame
    CHARGE_SLOW:   0.6,       // move-speed multiplier while charging
    T1_S:          90,
    T2_S:          30,
    EIGEN_TOL_DEG: 10,        // beam is a no-op within this of ±axis
    ARC_MS:        250,       // sphere animation for a landed hit
    WORLD_W:       1280,
    WORLD_H:       800,
    SHIP_R:        22,
  };

  const AXES = { X:{x:1,y:0,z:0}, Y:{x:0,y:1,z:0}, Z:{x:0,y:0,z:1} };

  // ── Beam catalogue (D1 mechanics) ───────────────────────────────────
  // Two families, and the split is the real Clifford / non-Clifford one:
  //
  //   X, Y  — continuous-θ ATTACK beams. They tilt the vector toward or away
  //           from |1⟩, so they move MEASURE odds. Both are blocked when the
  //           target is parked at an eigenstate of that beam's own axis.
  //   T     — a FIXED π/4 phase rotation about z, and the scarce resource.
  //           It changes P(|1⟩) by exactly zero, so it can never win a round
  //           on its own. What it does is break camping — see below.
  //
  // Why T is the anti-turtle tool, and why Z is not: a camper sits at an
  // eigenstate of your attack axis (|±⟩ for X) where your beam is a no-op.
  // Z is Clifford, and a π rotation about z maps the X-eigenstate SET to
  // itself (|+⟩ ↔ |−⟩) — the camper is still camped. T is non-Clifford;
  // Rz(π/4) lands them at 45°, off every cardinal axis, where nothing
  // shields them. That is Gottesman–Knill showing up as a tactic: the gate
  // that buys you real quantum power is the gate that breaks the turtle.
  // (Asserted in duel_harness cases t1/t2 — it is a claim, so it is tested.)
  const BEAMS = {
    X: { axis:'X', kind:'attack', color:'#ff5a72', label:'X-BEAM',  clifford:true  },
    Y: { axis:'Y', kind:'attack', color:'#3fe08a', label:'Y-BEAM',  clifford:true  },
    T: { axis:'Z', kind:'phase',  color:'#f5b73c', label:'T-PHASE', clifford:false,
         fixedTheta: Math.PI/4, scarce:true },
  };

  // Zones — a "decoherence hotspot" is a patch of chip with brutal local T1/T2.
  // Flee into one and your own charge bleeds toward |0⟩ in seconds. That makes
  // it a genuine sanctuary (a discharged qubit is a terrible MEASURE target)
  // bought with your entire offence: you cannot hold a charge in there either.
  const ZONE = { HOT_T1: 4, HOT_T2: 2 };
  function zoneAt(x, y, zones) {
    if (!zones) return null;
    for (const z of zones)
      if ((x-z.x)*(x-z.x) + (y-z.y)*(y-z.y) <= z.r*z.r) return z;
    return null;
  }

  // Pulse fidelity: a real drive is never perfectly calibrated, so the angle
  // you actually deliver is θ ± error. fidelity 1 = textbook pulse; lower =
  // sloppier. Calibration pickups buy fidelity back. σ is in radians.
  const FIDELITY_SIGMA0 = 0.42;                     // σ at fidelity 0
  const sigmaFor = fid => FIDELITY_SIGMA0 * (1 - Math.max(0, Math.min(1, fid)));
  function gauss(rand) {                            // Box–Muller, seeded
    let u = 0, v = 0;
    while (u === 0) u = rand();
    while (v === 0) v = rand();
    return Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*v);
  }
  const applyFidelity = (theta, fid, rand) =>
    theta + gauss(rand) * sigmaFor(fid);

  // Is the vector parked on a cardinal axis (an eigenstate of SOME axis)?
  // Used to tell a camper from a live target, and to prove T knocks them off.
  function isCardinal(r, tolDeg = K.EIGEN_TOL_DEG) {
    return ['X','Y','Z'].some(a => eigenstateAngleDeg(r, a) <= tolDeg);
  }

  // Seeded RNG so harness runs (and any future replay) are deterministic —
  // same generator the bot harnesses already use.
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Hold time → rotation angle. Linear in time and capped at π, so a full
  // hold is exactly a π-pulse (|0⟩→|1⟩) and a tap is a small nudge. The
  // charge bar is labelled in π-fractions so the player reads pulse AREA.
  const chargeToTheta = tHoldSec =>
    Math.PI * Math.min(Math.max(tHoldSec, 0) / K.CHARGE_FULL_S, 1);

  const norm = n => { const m = Math.hypot(n.x, n.y, n.z) || 1;
                      return { x:n.x/m, y:n.y/m, z:n.z/m }; };

  // Right-handed rotation of a Bloch vector about a unit axis (Rodrigues).
  // See the module header: equivalent to QPhysics.rabiRotateState on pure
  // states, valid for mixed ones too. Preserves |r| exactly (unitary).
  function rotateBloch(r, axis, theta) {
    const n = norm(axis);
    const c = Math.cos(theta), s = Math.sin(theta);
    const dot = n.x*r.x + n.y*r.y + n.z*r.z;
    const cr = { x: n.y*r.z - n.z*r.y,
                 y: n.z*r.x - n.x*r.z,
                 z: n.x*r.y - n.y*r.x };
    return {
      x: r.x*c + cr.x*s + n.x*dot*(1-c),
      y: r.y*c + cr.y*s + n.y*dot*(1-c),
      z: r.z*c + cr.z*s + n.z*dot*(1-c),
    };
  }

  // Angle between the state vector and a beam axis, in degrees, folded to
  // [0,90] — parking at EITHER pole of an axis makes that axis a no-op.
  function eigenstateAngleDeg(r, axisName) {
    const n = AXES[axisName]; if (!n) return 90;
    const m = Math.hypot(r.x, r.y, r.z);
    if (m < 1e-9) return 90;                       // fully mixed: no eigen-parking
    const cosA = Math.abs((r.x*n.x + r.y*n.y + r.z*n.z) / m);
    return Math.acos(Math.min(1, cosA)) * 180 / Math.PI;
  }
  const isEigenstate = (r, axisName, tolDeg = K.EIGEN_TOL_DEG) =>
    eigenstateAngleDeg(r, axisName) <= tolDeg;

  // A beam landing: rotate about its axis by θ, unless the target is parked
  // at an eigenstate of that axis (rotation would be a no-op anyway — the
  // shield mechanic makes that physical fact visible as a refraction).
  function applyBeamHit(r, axisName, theta) {
    if (isEigenstate(r, axisName)) return { bloch: r, shielded: true };
    return { bloch: rotateBloch(r, AXES[axisName], theta), shielded: false };
  }

  // Open-system decay, straight through the campaign's exact Lindblad step.
  // zone lets a biome (D2 nebula) shorten T2 locally.
  function decayStep(r, dtSec, zone) {
    const T1 = (zone && zone.t1) || K.T1_S;
    const T2 = (zone && zone.t2) || K.T2_S;
    return QPhysics.lindbladStep(r, { T1, T2, dt: dtSec });
  }

  const odds = r => QPhysics.charge(r);            // P(|1⟩) — the win chance

  // MEASURE: project onto the Z basis with the Born rule. Outcome 1 wins the
  // round; outcome 0 is a dud that leaves the target in |0⟩ — it must be
  // re-rotated from scratch, which is the real cost of a mistimed shot.
  function measureRoll(r, rand = Math.random) {
    const p = odds(r);
    const outcome = rand() < p ? 1 : 0;
    return {
      outcome, p,
      bloch: outcome === 1 ? { x:0, y:0, z:-1 } : { x:0, y:0, z:1 },
    };
  }

  // ── Bell trap (entangle beam) ────────────────────────────────────────
  // Landing an entangle beam puts both duellists into |Φ+⟩. From that moment
  // NEITHER qubit has its own charge: each reads 50%, and a MEASURE on either
  // collapses BOTH to the same outcome. That makes it the comeback move —
  // if you are at 5% and they are at 95%, entangling resets the round to an
  // honest coin flip. It is also the no-signalling lesson in mechanical form:
  // you cannot use the link to DO anything to them, only to share a fate.
  // Runs on QPhysics.Bell, the campaign's own 2-qubit machinery.
  function bellPair() { return QPhysics.Bell.phiPlus(); }
  function bellOdds(amps, which) { return QPhysics.Bell.marginalP1(amps, which); }
  function bellMeasure(amps, which, rand = Math.random) {
    const res = QPhysics.Bell.measure(amps, which, rand);
    const toBloch = bit => ({ x:0, y:0, z: bit === 1 ? -1 : 1 });
    return {
      outcome: res.outcome,
      partnerOutcome: res.partnerOutcome,
      p: bellOdds(amps, which),
      blochSelf: toBloch(res.outcome),
      blochPartner: toBloch(res.partnerOutcome),
    };
  }

  // ── Quantum Zeno lock ────────────────────────────────────────────────
  // Measure the same target twice inside ZENO_WINDOW and it freezes: further
  // rotations do nothing to it for ZENO_HOLD seconds. This is the real Zeno
  // effect (a watched qubit cannot evolve), used as denial — you pin them at
  // |0⟩ so they cannot charge up to threaten you. Expensive: MEASURE is on a
  // 6s cooldown, so a lock costs you two of them.
  const ZENO = { WINDOW: 4, HOLD: 2.5, NEEDED: 2 };

  // The full beam-landing rule, with every D1 mechanic folded in. Pure:
  // callers hand in the target's state and the shooter's fidelity/RNG.
  //   returns { bloch, shielded, zenoBlocked, theta, deltaOdds }
  function resolveBeam(targetBloch, beamKey, thetaNominal, opts) {
    const o = opts || {};
    const beam = BEAMS[beamKey] || BEAMS.X;
    const before = targetBloch;
    if (o.zenoUntil && o.now != null && o.now < o.zenoUntil)
      return { bloch: before, shielded: false, zenoBlocked: true,
               theta: 0, deltaOdds: 0 };
    const theta = beam.fixedTheta != null
      ? beam.fixedTheta
      : applyFidelity(thetaNominal, o.fidelity == null ? 1 : o.fidelity,
                      o.rand || Math.random);
    if (isEigenstate(before, beam.axis))
      return { bloch: before, shielded: true, zenoBlocked: false,
               theta, deltaOdds: 0 };
    const after = rotateBloch(before, AXES[beam.axis], theta);
    return { bloch: after, shielded: false, zenoBlocked: false, theta,
             deltaOdds: odds(after) - odds(before) };
  }

  // ── Duel missions: the campaign's concept gating, reborn ─────────────
  // The 7-mission campaign's real value was never the chess board — it was
  // the campaign's shield rule: a target you CANNOT beat unless you use the
  // concept. Ported here verbatim in spirit. Each mission names a concept and
  // a gate; the gate inspects EVIDENCE collected during the round and refuses
  // a win that didn't use it. Pure and data-only so duel_harness can prove
  // (not assert) that concept-free play never clears missions 2–7.
  //
  // evidence = { entangled, usedT, superposedShot, zenoLocked, fidelity,
  //              elapsed, measuredIdx }
  const DUEL_MISSIONS = [
    { id:0, title:'THE BORN RULE', concept:'Born rule',
      brief:'Their qubit starts in |0⟩ — a MEASURE now is guaranteed to fail. Rotate them toward |1⟩ with the X-beam, then MEASURE. Your hit chance IS P(|1⟩).',
      win:'Born rule: the probability you read on the HUD is the probability you got.',
      gate: () => ({ blocked:false }) },

    { id:1, title:'DECOHERENCE RACE', concept:'T₁ relaxation',
      brief:'They start fully charged, but T₁ is bleeding them back to |0⟩ fast. Land the MEASURE inside 20 seconds — after that the odds are gone and so is the round.',
      win:'T₁ conquered: an excited state is a perishable asset, not a bank balance.',
      hurry: 20,
      gate: ev => ev.elapsed > 20
        ? { blocked:true, reason:'Too slow — T₁ already drained the charge you were aiming at. Restart and strike inside 20s.' }
        : { blocked:false } },

    { id:2, title:'THE BELL GAMBIT', concept:'Entanglement & correlated collapse',
      brief:'This opponent is shielded: a direct MEASURE cannot resolve them. ENTANGLE first (E) — once you share |Φ+⟩, one measurement collapses BOTH, correlated, and that is a result the shield cannot refuse.',
      win:'Correlated collapse: you did not measure them, you measured the PAIR.',
      shielded:true,
      gate: ev => ev.entangled
        ? { blocked:false }
        : { blocked:true, reason:'Shielded — a lone qubit cannot be resolved here. Entangle (E) and measure the pair.' } },

    { id:3, title:'SUPERPOSITION GAMBIT', concept:'Superposition',
      brief:'Their armour only yields to a beam fired from superposition. Put YOUR OWN qubit off the poles first (a partial X-charge, not a full π), then fire.',
      win:'Superposition: the state between the poles is a real, usable resource.',
      gate: ev => ev.superposedShot
        ? { blocked:false }
        : { blocked:true, reason:'Every hit bounced — you fired from a pole. Charge partway (≈π/2) so your own qubit is in superposition, then fire.' } },

    { id:4, title:'PHASE GAMBIT', concept:'Non-Clifford phase (Gottesman–Knill)',
      brief:'They camp on an eigenstate, where your attack beams are a no-op. A Clifford phase flip just moves them to the other pole of the same axis — still camped. Spend a T-charge (3): only a non-Clifford π/4 knocks them off every axis.',
      win:'Non-Clifford phase: T is the gate that buys real quantum power — and breaks a turtle.',
      camper:true,
      gate: ev => ev.usedT
        ? { blocked:false }
        : { blocked:true, reason:'They re-camped every time. Clifford gates map eigenstates to eigenstates — you need a T-phase (3) to land them off-axis.' } },

    { id:5, title:'THE ZENO CAGE', concept:'Quantum Zeno effect',
      brief:'This one re-charges the instant you stop watching. Land two MEASUREs inside 4 seconds to pin it — a watched qubit cannot evolve — then finish it while it is frozen.',
      win:'Quantum Zeno: observation itself is the cage.',
      regen:true,
      gate: ev => ev.zenoLocked
        ? { blocked:false }
        : { blocked:true, reason:'It out-charged you. Two MEASUREs inside 4s freeze it — pin it first, then finish it.' } },

    { id:6, title:'PULSE FORGE', concept:'Pulse calibration',
      brief:'Your drive is badly detuned: every beam misses the angle you asked for. Collect calibration pickups until fidelity ≥ 90%, then land a MEASURE. A pulse you cannot aim is not a gate.',
      win:'Calibration: θ = Ω·t only means something if your Ω is what you think it is.',
      lowFidelity:0.15,
      gate: ev => ev.fidelity >= 0.9
        ? { blocked:false }
        : { blocked:true, reason:`Fidelity ${Math.round(ev.fidelity*100)}% — your pulses are still guesswork. Reach 90% before you measure.` } },
  ];

  function missionGate(idx, evidence) {
    const m = DUEL_MISSIONS[idx];
    if (!m) return { blocked:false };
    return m.gate(evidence || {});
  }

  // ── BELL TRIAL — the CHSH game (minigame #2) ─────────────────────────
  // The most adversarial game in physics, and the win condition IS the
  // physics. A referee sends you and your partner one random bit each (x, y).
  // You each answer a bit (a, b) with NO communication. You win the round iff
  //     a XOR b  ==  x AND y
  // Any classical strategy — including any pre-agreed lookup table, which is
  // what a "local hidden variable" IS — tops out at 75%. Sharing a Bell pair
  // and measuring at well-chosen angles reaches cos²(π/8) ≈ 85.36%.
  // So the opponent here is not a bot: it is the classical bound itself, and
  // beating 75% is a real refutation of local realism, played with a mouse.
  //
  // Angles are the two measurement directions each side commits to, one per
  // referee bit. The textbook optimum is A = {0, π/2}, B = {π/4, -π/4}.
  const CHSH = {
    CLASSICAL: 0.75,                       // best possible local-realist strategy
    TSIRELSON: Math.cos(Math.PI/8)**2,     // ≈0.8536 — quantum maximum
    // With P(agree)=cos²(α−β) these are the optimal settings: every one of
    // the four referee cases then sits at cos²(π/8). (The textbook's
    // {0,π/2}/{π/4,−π/4} belongs to the half-angle convention where
    // E=cos(2(α−β)) is written in terms of physical polarizer angles — using
    // those here silently drops you to 50%, which is what harness case c1
    // caught.)
    OPTIMAL_A: [0, Math.PI/4],
    OPTIMAL_B: [Math.PI/8, -Math.PI/8],
  };

  // Quantum prediction for one round on |Φ+⟩: measuring at angles α and β
  // gives correlation E = cos(2(α−β)), so P(a==b) = cos²(α−β).
  const chshAgreeProb = (alpha, beta) => Math.cos(alpha - beta) ** 2;

  // Play one round honestly: sample the shared Bell pair's joint statistics.
  function chshRound(angA, angB, x, y, rand) {
    const alpha = angA[x], beta = angB[y];
    const pAgree = chshAgreeProb(alpha, beta);
    const agree = rand() < pAgree;
    const a = rand() < 0.5 ? 1 : 0;        // marginal is fair on |Φ+⟩
    const b = agree ? a : 1 - a;
    const won = ((a ^ b) === (x & y));
    return { a, b, won, pAgree };
  }

  // Expected win rate for a chosen pair of angle-settings, exactly (no
  // sampling): the referee picks (x,y) uniformly, so average the four cases.
  function chshWinRate(angA, angB) {
    let s = 0;
    for (let x = 0; x < 2; x++) for (let y = 0; y < 2; y++) {
      const pAgree = chshAgreeProb(angA[x], angB[y]);
      // need a XOR b == x AND y: agreement wins unless both bits are 1
      s += (x & y) ? (1 - pAgree) : pAgree;
    }
    return s / 4;
  }

  // The CHSH S-parameter, the number physicists actually quote.
  // S = 4·(2·winRate − 1); |S| ≤ 2 classically, ≤ 2√2 quantum mechanically.
  const chshS = winRate => 4 * (2 * winRate - 1);

  return { CHSH, chshAgreeProb, chshRound, chshWinRate, chshS,
           K, AXES, BEAMS, ZONE, ZENO, DUEL_MISSIONS, missionGate,
           mulberry32, chargeToTheta, rotateBloch,
           eigenstateAngleDeg, isEigenstate, isCardinal, applyBeamHit,
           resolveBeam, decayStep, zoneAt, odds, measureRoll,
           sigmaFor, applyFidelity, bellPair, bellOdds, bellMeasure };
})();
if (typeof window !== 'undefined') window.DuelCore = DuelCore;

// QB-8 — honour prefers-reduced-motion. The duel gates its own particle

// RENDERING
// ═══════════════════════════════════════════════════════
const canvas = document.getElementById('game-canvas');
const ctx    = canvas.getContext('2d');
// FE-2 — devicePixelRatio-aware backing store. #game-canvas's CSS size is
// fully controlled by its own width/aspect-ratio rules (decoupled from the
// canvas width/height attributes by `aspect-ratio:1/1`), so scaling the
// backing store up by DPR only adds physical-pixel resolution — it never
// touches layout. Every draw call keeps using BOARD-unit logical coordinates
// (0–800); the ctx transform below maps those onto the higher-res bitmap, so
// nothing downstream of this line needs to know DPR exists.
// REGRESSION TRAP (FE-2): input mapping (the click/mousemove handlers) and
// menuDims() used to derive their CSS↔canvas scale from `canvas.width`, which
// was safe only because canvas.width === BOARD. Now that canvas.width is
// BOARD*DPR (physical), those must scale against BOARD (logical) instead —
// fixed at their call sites below.
const DPR = Math.max(1, window.devicePixelRatio || 1);
function sizeCanvasBackingStore() {
  const rect = canvas.getBoundingClientRect();
  const cssW = rect.width > 0 ? rect.width : BOARD;
  const px = Math.max(1, Math.round(cssW * DPR));
  if (canvas.width !== px) { canvas.width = px; canvas.height = px; }
  const s = px / BOARD;                 // logical 0..BOARD -> physical pixels
  ctx.setTransform(s, 0, 0, s, 0, 0);
}
sizeCanvasBackingStore();
window.addEventListener('resize', sizeCanvasBackingStore);
let   _t     = 0;
// FE-1 — display-contract fix: every per-frame accumulator below advances by
// real elapsed ms (_frameDt) or a 60Hz-equivalent tick count (_frameTicks),
// never a bare per-call constant, so gameplay speed no longer depends on the
// display's refresh rate. Set once per loop() call; clamped so a backgrounded
// tab's huge first-dt-after-return doesn't teleport sprites.
let _frameDt = MS_PER_TICK, _frameTicks = 1, _lastFrameTs = null;

function canvasCssScale() {
  const rect = canvas.getBoundingClientRect();
  return rect.width>0 ? rect.width/BOARD : 1;
}
// Same growth pattern as menuDims(), targeting a ~10 CSS px floor instead of
// a 44px touch target: grows the logical font size just enough that the
// on-screen text never drops below ~10 CSS px, and never shrinks a font
// that's already big enough (Math.max(1, ...) floor, same as menuDims()).
// TY-4 — second arg: the CSS-px floor for this text's tier. Dense canvas
// text (menu rows, cards, overlay prose) renders in the body face with a
// 13px floor to match the DOM's --fs-0; the pixel face survives on canvas
// only for banners (WIN/DRAW headlines), in-world unit glyphs, and FX
// floats. Default floor stays 10 for legacy callers.
const CANVAS_BODY = "'Space Grotesk',sans-serif";
function canvasFontPx(basePx, floorCss = 10) {
  return basePx * Math.max(1, floorCss/(basePx*canvasCssScale()));
}
// Glow behind text this small just smears the edges into mush. Only the
// UN-grown size matters: canvasFontPx() never grows a font past what's
// needed to clear the 10px floor, so if the base size doesn't already clear
// 14 CSS px at the current scale, the grown size won't either.
function canvasGlowOk(basePx) {
  return basePx * canvasCssScale() >= 14;
}

function roundRect(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

// ═══════════════════════════════════════════════════════
// BLOCH SPHERE
// ═══════════════════════════════════════════════════════
// PD-7 — the sphere renderer, factored out of drawBloch() so the duel HUD
// draws the SAME sphere the campaign panel does (design pillar 1: the sphere
// is the game state, so there must be exactly one of it). Geometry, colors
// and the x/y foreshortening projection are the original drawBloch code
// verbatim; drawBloch now calls this and is pixel-identical to before.
function drawMiniSphere(bx, cx, cy, R, bloch, vecCol, showLabels) {
  const bg=bx.createRadialGradient(cx-12,cy-12,2,cx,cy,R);
  bg.addColorStop(0,'#2a3358'); bg.addColorStop(1,'#0a0f22');
  bx.fillStyle=bg; bx.beginPath(); bx.arc(cx,cy,R,0,2*π); bx.fill();

  bx.strokeStyle='rgba(140,150,200,0.55)'; bx.lineWidth=1;
  bx.beginPath(); bx.arc(cx,cy,R,0,2*π); bx.stroke();
  bx.strokeStyle='rgba(140,150,200,0.30)'; bx.lineWidth=0.7;
  bx.beginPath(); bx.ellipse(cx,cy,R,R*0.27,0,0,2*π); bx.stroke();
  bx.beginPath(); bx.ellipse(cx,cy,R*0.27,R,0,0,2*π); bx.stroke();
  bx.strokeStyle='rgba(140,150,200,0.22)'; bx.lineWidth=0.6;
  bx.beginPath(); bx.moveTo(cx,cy-R+2); bx.lineTo(cx,cy+R-2); bx.stroke();
  bx.beginPath(); bx.moveTo(cx-R+2,cy); bx.lineTo(cx+R-2,cy); bx.stroke();

  if (showLabels !== false) {
    bx.fillStyle='rgba(207,214,238,0.85)'; bx.font=`600 11px ${CANVAS_BODY}`;
    bx.fillText('|0⟩',cx+3,cy-R+10); bx.fillText('|1⟩',cx+3,cy+R-2);
    // X-basis poles (|+⟩ / |−⟩) — the basis a GUARD is measured in, where phase decides the crit.
    bx.fillStyle='rgba(123,213,196,0.9)';
    bx.fillText('|+⟩',cx+R*0.5,cy+10); bx.fillText('|−⟩',cx-R*0.5-18,cy+10);
    // |1⟩ pole glows red — that's full charge (strongest strike).
    bx.fillStyle='#ff5a72'; bx.shadowColor='#ff5a72'; bx.shadowBlur=7;
    bx.beginPath(); bx.arc(cx,cy+R,3,0,2*π); bx.fill(); bx.shadowBlur=0;
  }

  if (!bloch) return;
  // Read the open-system Bloch vector: a coherent state sits on the sphere
  // surface (|r|=1); a decohered (mixed) state contracts inward (|r|<1) — the
  // visible signature of Lindblad relaxation.
  const vx=bloch.x, vy=bloch.y, vz=bloch.z;
  const sx=cx+R*(vx*0.7+vy*0.3);
  const sy=cy-R*vz;

  bx.strokeStyle=vecCol; bx.lineWidth=2;
  bx.shadowColor=vecCol; bx.shadowBlur=10;
  bx.beginPath(); bx.moveTo(cx,cy); bx.lineTo(sx,sy); bx.stroke();
  bx.fillStyle=vecCol;
  bx.beginPath(); bx.arc(sx,sy,3.5,0,2*π); bx.fill();
  bx.shadowBlur=0;
  bx.fillStyle='rgba(255,255,255,0.4)';
  bx.beginPath(); bx.arc(cx,cy,2,0,2*π); bx.fill();
}

// "A top-down laser duel where your opponent's health bar is their qubit."
// Rules live in DuelCore (pure, harness-tested); this module is the shell:
// entities, fixed-timestep sim, input, HUD, telemetry. It shares the

// MEASURE win, procedural SFX, starfield, telemetry events 1–4. Deliberately
// NOT here: Y/Z beams, biomes, echo pickups, the real bot (a dumb seeded
// drone stands in), the landing screen, unlock ladder, real debrief cards.
let MODE = 'story';                       // 'story' | 'duel'  (PD-1)

const DUEL = (() => {
  const K = DuelCore.K;
  // World is 16:10 (1280×800); the canvas is square, so letterbox it and
  // spend the two bands on HUD instead of black bars.
  const SCALE = BOARD / K.WORLD_W;                 // 0.625
  const VIEW_H = K.WORLD_H * SCALE;                // 500
  const BAND = (BOARD - VIEW_H) / 2;               // 150 top and bottom
  const w2sx = wx => wx * SCALE;
  const w2sy = wy => BAND + wy * SCALE;

  const S = {
    active: false, paused: false, over: false,
    t: 0, acc: 0, last: null,
    rand: null, seed: 0,
    ships: [], proj: [], parts: [], stars: [], zones: [], pickups: [],
    pickupTimer: 0, beam: 'X',
    keys: Object.create(null),
    aim: { x: K.WORLD_W / 2, y: 0 },
    charging: false, chargeT: 0,
    round: { winner: null, method: null, p: 0, endedAt: 0 },
    tele: [], loadedAt: 0, firstShotSent: false, sphereReadSent: false,
    shotCount: 0, thetas: [], axisCounts: { X: 0, Y: 0, T: 0 }, measures: 0,
    floats: [], bell: null, mission: -1, ev: null, gateMsg: '', gateMsgT: 0,
    frameMs: [], showPerf: false,
  };

  // ── Entity pools — preallocated; the sim never allocates (perf budget) ──
  function mkPool(n, shape) {
    const a = new Array(n);
    for (let i = 0; i < n; i++) a[i] = Object.assign({ live: false }, shape());
    return a;
  }
  function take(pool) {
    for (let i = 0; i < pool.length; i++) if (!pool[i].live) return pool[i];
    return null;                                   // pool full: drop, never grow
  }

  function initPools() {
    if (S.proj.length) return;
    S.proj = mkPool(64, () => ({ x:0, y:0, vx:0, vy:0, kind:'beam', beam:'X',
                                 theta:0, owner:0, ttl:0 }));
    S.parts = mkPool(400, () => ({ x:0, y:0, vx:0, vy:0, life:0, max:1,
                                   col:'#fff', r:2 }));
  }

  function spawnParts(n, x, y, col, spd, life) {
    for (let i = 0; i < n; i++) {
      const p = take(S.parts); if (!p) return;
      const a = S.rand() * Math.PI * 2, v = spd * (0.35 + S.rand());
      p.live = true; p.x = x; p.y = y;
      p.vx = Math.cos(a) * v; p.vy = Math.sin(a) * v;
      p.life = p.max = life; p.col = col; p.r = 1.5 + S.rand() * 2;
    }
  }

  // ── Audio — procedural, zero asset bytes (PD-9). Same WebAudio path the
  //    campaign's beep()/sfxDecohere() already use, extended with frequency
  //    sweeps and a noise burst. (The plan named jsfxr; a ~60-line synth on
  //    the existing audio path gets the same "no files, tiny" outcome without
  //    vendoring an unvetted library — richer presets can land with the D2
  //    asset pipeline if playtests ask for them.)
  function sweep(f0, f1, dur, type, vol) {
    const c = ac(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination);
    o.type = type; o.frequency.setValueAtTime(f0, c.currentTime);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), c.currentTime + dur);
    g.gain.setValueAtTime(vol, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
    o.start(); o.stop(c.currentTime + dur);
  }
  function noise(dur, vol) {
    const c = ac(); if (!c) return;
    const buf = c.createBuffer(1, Math.max(1, (c.sampleRate * dur) | 0), c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const src = c.createBufferSource(), g = c.createGain();
    src.buffer = buf; src.connect(g); g.connect(c.destination);
    g.gain.setValueAtTime(vol, c.currentTime);
    src.start(); src.stop(c.currentTime + dur);
  }
  const sfxFire    = () => sweep(880, 180, 0.16, 'sawtooth', 0.16);
  const sfxHit     = () => noise(0.14, 0.22);
  const sfxShield  = () => sweep(300, 900, 0.16, 'sine', 0.13);
  const sfxWind    = () => sweep(220, 1400, DuelCore.K.MEASURE_WIND_S, 'sine', 0.10);
  const sfxCollapse= () => { noise(0.3, 0.3); sweep(400, 60, 0.5, 'sawtooth', 0.2); };
  const sfxDud     = () => sweep(240, 90, 0.3, 'triangle', 0.15);

  // ── Telemetry (PD-11, design doc §8 items 1–4). Local only; rides the
  //    existing instructor gate-log export, no third-party anything.
  function tele(type, data) {
    S.tele.push(Object.assign({ type, tMs: Math.round(performance.now() - S.loadedAt) },
                              data || {}));
  }

  // ── Ships ────────────────────────────────────────────────────────────
  function mkShip(owner, x, y, col) {
    return { owner, x, y, vx: 0, vy: 0, ang: 0, col,
             bloch: { x: 0, y: 0, z: 1 },            // |0⟩
             arc: null,                              // {from,to,t} sphere animation
             beamCd: 0, measCd: 0, winding: 0, hitFlash: 0, shieldFlash: 0,
             // D1 mechanics
             fidelity: 0.55,      // sloppy pulses until you find calibration
             tCharges: 1,         // scarce non-Clifford resource
             bellIdx: -1,         // 0/1 while entangled, else -1
             zenoUntil: 0,        // Zeno lock expiry (S.t seconds)
             measStamps: [],      // recent MEASURE landings on THIS ship
             inHot: false };
  }

  function start(seed, mission) {
    initPools();
    S.seed = seed || (Date.now() & 0xffffffff);
    S.rand = DuelCore.mulberry32(S.seed);
    S.ships = [ mkShip(0, K.WORLD_W * 0.22, K.WORLD_H * 0.5, '#2fe0d0'),
                mkShip(1, K.WORLD_W * 0.78, K.WORLD_H * 0.5, '#ff4d9d') ];
    S.proj.forEach(p => p.live = false);
    S.parts.forEach(p => p.live = false);
    // Decoherence hotspots — three fixed patches of noisy chip. Fixed, not
    // random: they are terrain to learn, not a lottery.
    S.zones = [
      { x: K.WORLD_W*0.5,  y: K.WORLD_H*0.28, r: 118, t1: DuelCore.ZONE.HOT_T1, t2: DuelCore.ZONE.HOT_T2 },
      { x: K.WORLD_W*0.22, y: K.WORLD_H*0.78, r:  96, t1: DuelCore.ZONE.HOT_T1, t2: DuelCore.ZONE.HOT_T2 },
      { x: K.WORLD_W*0.79, y: K.WORLD_H*0.74, r:  96, t1: DuelCore.ZONE.HOT_T1, t2: DuelCore.ZONE.HOT_T2 },
    ];
    S.pickups = []; S.pickupTimer = 4; S.beam = 'X'; S.bell = null;
    S.stars = [];
    for (let i = 0; i < 140; i++)
      S.stars.push({ x: S.rand() * K.WORLD_W, y: S.rand() * K.WORLD_H,
                     z: S.rand() < 0.5 ? 0.35 : 0.8, r: S.rand() * 1.6 + 0.4 });
    S.active = true; S.paused = false; S.over = false;
    S.t = 0; S.acc = 0; S.last = null;
    S.charging = false; S.chargeT = 0;
    S.round = { winner: null, method: null, p: 0, endedAt: 0 };
    S.tele = []; S.loadedAt = performance.now();
    S.firstShotSent = false; S.sphereReadSent = false;
    S.shotCount = 0; S.thetas = []; S.axisCounts = { X:0, Y:0, T:0 }; S.measures = 0;
    S.floats = [];
    S.frameMs = [];
    // ── Mission setup (concept scenarios; -1 = free duel) ──────────────
    S.mission = (mission == null) ? -1 : mission;
    S.ev = { entangled:false, usedT:false, superposedShot:false,
             zenoLocked:false, fidelity:0, elapsed:0, measuredIdx:-1 };
    S.gateMsg = ''; S.gateMsgT = 0;
    const M = DuelCore.DUEL_MISSIONS[S.mission];
    if (M) {
      const foe = S.ships[1];
      if (M.id === 1) foe.bloch = { x:0, y:0, z:-1 };          // pre-charged, racing T1
      if (M.camper)  foe.bloch = { x:1, y:0, z:0 };            // parked at |+⟩
      if (M.lowFidelity != null) S.ships[0].fidelity = M.lowFidelity;
      if (M.id === 4) S.ships[0].tCharges = 1;                 // exactly one T to learn with
      if (M.shielded || M.camper) S.zones = S.zones.slice(0, 1);
    }
    tele('duel_load', { seed: S.seed, mission: S.mission,
                        concept: M ? M.concept : 'free-duel' });
  }
  function stop() { S.active = false; }

  // ── Firing ───────────────────────────────────────────────────────────
  function fireBeam(ship, theta, beamKey) {
    const spec = DuelCore.BEAMS[beamKey] || DuelCore.BEAMS.X;
    if (spec.scarce) {                                // T is a resource, not a button
      if (ship.tCharges <= 0) { sfxDud(); return; }
      ship.tCharges--;
    }
    const p = take(S.proj); if (!p) return;
    p.live = true; p.kind = 'beam'; p.beam = beamKey; p.theta = theta;
    p.owner = ship.owner; p.ttl = 4;
    p.x = ship.x + Math.cos(ship.ang) * K.SHIP_R;
    p.y = ship.y + Math.sin(ship.ang) * K.SHIP_R;
    p.vx = Math.cos(ship.ang) * K.BEAM_SPEED;
    p.vy = Math.sin(ship.ang) * K.BEAM_SPEED;
    ship.beamCd = K.BEAM_CD_S;
    if (ship.owner === 0 && S.ev) {
      if (spec.scarce) S.ev.usedT = true;
      // "Fired from superposition" = the shooter's own vector is off both
      // poles when the shot leaves — mission 3's concept, measured not claimed.
      if (!DuelCore.isEigenstate(ship.bloch, 'Z')) S.ev.superposedShot = true;
    }
    sfxFire();
    if (ship.owner === 0) {
      S.shotCount++; S.thetas.push(+(theta / Math.PI).toFixed(3));
      S.axisCounts[beamKey] = (S.axisCounts[beamKey] || 0) + 1;
      if (!S.firstShotSent) {
        S.firstShotSent = true;
        tele('first_shot', { theta_over_pi: +(theta / Math.PI).toFixed(3) });
      }
    }
  }
  function fireMeasure(ship) {
    const p = take(S.proj); if (!p) return;
    p.live = true; p.kind = 'measure'; p.owner = ship.owner; p.ttl = 5;
    p.x = ship.x + Math.cos(ship.ang) * K.SHIP_R;
    p.y = ship.y + Math.sin(ship.ang) * K.SHIP_R;
    p.vx = Math.cos(ship.ang) * K.MEASURE_SPEED;
    p.vy = Math.sin(ship.ang) * K.MEASURE_SPEED;
    ship.measCd = K.MEASURE_CD_S;
    if (ship.owner === 0) S.measures++;
  }

  // A landed beam: rotate the target's qubit. The 250ms arc animation IS the
  // damage number — the sphere swinging is the feedback (design pillar 2).
  function landBeam(p, target) {
    const before = target.bloch;
    const shooter = S.ships[p.owner];
    const res = DuelCore.resolveBeam(before, p.beam, p.theta, {
      fidelity: shooter.fidelity, rand: S.rand,
      zenoUntil: target.zenoUntil, now: S.t,
    });
    if (res.zenoBlocked) {
      target.shieldFlash = 0.4;
      spawnParts(8, p.x, p.y, '#8b7dff', 70, 0.4);
      floatTxt(target, 'ZENO-PINNED', '#8b7dff');
      sfxShield();
      return;
    }
    if (res.shielded) {
      target.shieldFlash = 0.4;
      spawnParts(10, p.x, p.y, '#9aa3cf', 90, 0.5);
      floatTxt(target, 'EIGENSTATE!', '#9aa3cf');
      sfxShield();
      return;
    }
    // While entangled, a local rotation cannot change the partner's odds —
    // the no-communication theorem. We keep the pair's 50/50 and just show
    // the beam landing; the link is broken only by a MEASURE.
    if (target.bellIdx >= 0) {
      target.hitFlash = 0.35;
      spawnParts(10, p.x, p.y, '#c97bff', 100, 0.5);
      floatTxt(target, 'NO-SIGNALLING', '#c97bff');
      return;
    }
    target.bloch = res.bloch;
    target.arc = { from: before, to: res.bloch, t: 0 };
    target.hitFlash = 0.35;
    const spec = DuelCore.BEAMS[p.beam] || DuelCore.BEAMS.X;
    spawnParts(14, p.x, p.y, spec.color, 130, 0.6);
    if (spec.kind === 'phase') floatTxt(target, 'PHASE ' + (p.beam === 'T' ? 'π/4' : ''), spec.color);
    sfxHit();
    // §8 item 3 — the learning beat: the player's beam visibly moved the
    // opponent's state vector. Fired once, on a ≥15° swing.
    if (!S.sphereReadSent && p.owner === 0) {
      const a = before, b = res.bloch;
      const ma = Math.hypot(a.x,a.y,a.z), mb = Math.hypot(b.x,b.y,b.z);
      if (ma > 1e-6 && mb > 1e-6) {
        const cos = (a.x*b.x + a.y*b.y + a.z*b.z) / (ma*mb);
        const deg = Math.acos(Math.max(-1, Math.min(1, cos))) * 180 / Math.PI;
        if (deg >= 15) {
          S.sphereReadSent = true;
          tele('first_sphere_read', { swing_deg: +deg.toFixed(1) });
        }
      }
    }
  }

  function landMeasure(p, target) {
    const other = S.ships[1 - (target.owner)];
    let res, method = 'measure';
    if (S.bell && target.bellIdx >= 0) {
      // Entangled: one measurement collapses BOTH, correlated. The shooter
      // wins only if the TARGET lands on |1⟩ — which is now a coin flip
      // regardless of how charged either side was before the link.
      const r = DuelCore.bellMeasure(S.bell, target.bellIdx, S.rand);
      target.bloch = r.blochSelf;
      other.bloch = r.blochPartner;
      target.bellIdx = other.bellIdx = -1; S.bell = null;
      floatTxt(target, 'CORRELATED', '#c97bff');
      res = { outcome: r.outcome, p: r.p };
      method = 'bell-measure';
    } else {
      res = DuelCore.measureRoll(target.bloch, S.rand);
      target.bloch = res.bloch;
    }
    target.arc = null;

    // Zeno bookkeeping: NEEDED landings inside WINDOW pin the target.
    target.measStamps.push(S.t);
    target.measStamps = target.measStamps.filter(t => S.t - t <= DuelCore.ZENO.WINDOW);
    if (target.measStamps.length >= DuelCore.ZENO.NEEDED && res.outcome === 0) {
      target.zenoUntil = S.t + DuelCore.ZENO.HOLD;
      target.measStamps = [];
      floatTxt(target, 'ZENO LOCK', '#8b7dff');
      if (p.owner === 0 && S.ev) S.ev.zenoLocked = true;
      tele('zeno_lock', { by: p.owner === 0 ? 'player' : 'sage' });
    }

    if (res.outcome === 1) {
      // Mission gate: the campaign's shield rule, reborn. A collapse that
      // did not use the mission's concept does not count — and says why.
      if (p.owner === 0 && S.mission >= 0) {
        S.ev.fidelity = S.ships[0].fidelity;
        S.ev.elapsed = S.t;
        const g = DuelCore.missionGate(S.mission, S.ev);
        if (g.blocked) {
          S.gateMsg = g.reason; S.gateMsgT = 6;
          spawnParts(20, target.x, target.y, '#9aa3cf', 120, 0.7);
          floatTxt(target, 'SHIELDED', '#9aa3cf');
          sfxShield();
          tele('mission_gate_blocked', { mission: S.mission, reason: g.reason });
          return;
        }
      }
      sfxCollapse();
      spawnParts(60, target.x, target.y, target.col, 260, 1.1);
      endRound(p.owner, method, res.p);
    } else {
      sfxDud();
      spawnParts(18, target.x, target.y, '#9aa3cf', 110, 0.6);
      floatTxt(target, 'DUD — reset to |0⟩', '#9aa3cf');
    }
  }

  // Entangle beam: puts both duellists into |Φ+⟩ (see DuelCore's Bell notes).
  function landEntangle(p, target) {
    const shooter = S.ships[p.owner];
    if (S.bell) return;
    S.bell = DuelCore.bellPair();
    shooter.bellIdx = 0; target.bellIdx = 1;
    shooter.arc = target.arc = null;
    spawnParts(40, target.x, target.y, '#c97bff', 190, 1.0);
    floatTxt(target, 'ENTANGLED — 50/50', '#c97bff');
    if (p.owner === 0 && S.ev) S.ev.entangled = true;
    sfxShield();
    tele('entangled', { by: p.owner === 0 ? 'player' : 'sage' });
  }

  // Small world-space floater, reusing the campaign's float list shape.
  function floatTxt(ship, text, col) {
    const f = { text, x: w2sx(ship.x), y: w2sy(ship.y) - 26, vy: -0.5,
                life: 1.6, color: col, size: 8 };
    S.floats.push(f);
    if (S.floats.length > 24) S.floats.shift();
  }

  function endRound(winner, method, p) {
    if (S.over) return;
    S.over = true;
    if (winner === 0 && S.mission >= 0) {
      GAME.duelDone = GAME.duelDone || [];
      if (!GAME.duelDone.includes(S.mission)) GAME.duelDone.push(S.mission);
      tele('mission_clear', { mission: S.mission,
        concept: (DuelCore.DUEL_MISSIONS[S.mission] || {}).concept });
    }
    S.round = { winner, method, p, endedAt: S.t };
    tele('round_end', {
      winner: winner === 0 ? 'player' : 'sage',
      method, P_at_measure: +p.toFixed(4),
      theta_histogram: S.thetas.slice(0, 200),
      axis_counts: Object.assign({}, S.axisCounts),
      shots: S.shotCount, measures: S.measures,
      duration_s: +S.t.toFixed(2),
    });
  }

  // ── Sim: one fixed 60Hz step ─────────────────────────────────────────
  function step(dt) {
    S.t += dt;
    const me = S.ships[0], foe = S.ships[1];

    // Player movement (WASD / arrows), slowed while charging.
    let ax = 0, ay = 0;
    if (S.keys['a'] || S.keys['arrowleft'])  ax -= 1;
    if (S.keys['d'] || S.keys['arrowright']) ax += 1;
    if (S.keys['w'] || S.keys['arrowup'])    ay -= 1;
    if (S.keys['s'] || S.keys['arrowdown'])  ay += 1;
    if (ax || ay) {
      const m = Math.hypot(ax, ay);
      const accel = K.SHIP_ACCEL * (S.charging ? K.CHARGE_SLOW : 1);
      me.vx += (ax / m) * accel * dt;
      me.vy += (ay / m) * accel * dt;
    }
    const maxSpd = K.SHIP_MAX_SPD * (S.charging ? K.CHARGE_SLOW : 1);
    for (const sh of S.ships) {
      const f = Math.pow(K.SHIP_FRICTION, dt * 60);
      sh.vx *= f; sh.vy *= f;
      const sp = Math.hypot(sh.vx, sh.vy);
      const cap = sh === me ? maxSpd : K.SHIP_MAX_SPD;
      if (sp > cap) { sh.vx = sh.vx / sp * cap; sh.vy = sh.vy / sp * cap; }
      sh.x += sh.vx * dt; sh.y += sh.vy * dt;
      // Solid walls
      const r = K.SHIP_R;
      if (sh.x < r) { sh.x = r; sh.vx = Math.abs(sh.vx) * 0.4; }
      if (sh.x > K.WORLD_W - r) { sh.x = K.WORLD_W - r; sh.vx = -Math.abs(sh.vx) * 0.4; }
      if (sh.y < r) { sh.y = r; sh.vy = Math.abs(sh.vy) * 0.4; }
      if (sh.y > K.WORLD_H - r) { sh.y = K.WORLD_H - r; sh.vy = -Math.abs(sh.vy) * 0.4; }
      // Cooldowns / flashes
      sh.beamCd = Math.max(0, sh.beamCd - dt);
      sh.measCd = Math.max(0, sh.measCd - dt);
      sh.hitFlash = Math.max(0, sh.hitFlash - dt);
      sh.shieldFlash = Math.max(0, sh.shieldFlash - dt);
      // Decoherence — the same Lindblad step the campaign runs per turn,
      // but the LOCAL T1/T2 if this ship is standing in a hotspot.
      const zone = DuelCore.zoneAt(sh.x, sh.y, S.zones);
      sh.inHot = !!zone;
      // An entangled qubit's own vector is meaningless until collapse (the
      // pair holds the state), so skip local decay while linked.
      if (sh.bellIdx < 0) sh.bloch = DuelCore.decayStep(sh.bloch, dt, zone);
      sh.entCd = Math.max(0, (sh.entCd || 0) - dt);
      // Mission 5's cage re-charges itself unless Zeno-pinned.
      const MM = DuelCore.DUEL_MISSIONS[S.mission];
      if (MM && MM.regen && sh.owner === 1 && sh.zenoUntil <= S.t && sh.bellIdx < 0) {
        const want = { x:0, y:0, z:-1 };
        sh.bloch = { x: sh.bloch.x*0.9, y: sh.bloch.y*0.9,
                     z: sh.bloch.z + (want.z - sh.bloch.z) * Math.min(1, dt*0.9) };
      }
      if (sh.arc) { sh.arc.t += dt * 1000 / K.ARC_MS; if (sh.arc.t >= 1) sh.arc = null; }
      // MEASURE wind-up (telegraph), then launch.
      if (sh.winding > 0) {
        sh.winding = Math.max(0, sh.winding - dt);
        if (sh.winding === 0) fireMeasure(sh);
      }
    }
    if (S.gateMsgT > 0) S.gateMsgT = Math.max(0, S.gateMsgT - dt);
    me.ang = Math.atan2(S.aim.y - me.y, S.aim.x - me.x);
    if (S.charging) S.chargeT += dt;

    // PD-8 — throwaway target drone. Not the bot: it drifts, keeps its
    // distance, aims with heavy error and fires on a timer, purely so the
    // spike is playable. The real Cadet/Duelist/Menace bots are D1.
    droneThink(foe, me, dt);

    // Projectiles
    for (const p of S.proj) {
      if (!p.live) continue;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.ttl -= dt;
      if (p.ttl <= 0 || p.x < -40 || p.x > K.WORLD_W + 40 || p.y < -40 || p.y > K.WORLD_H + 40) {
        p.live = false; continue;
      }
      const target = S.ships[1 - p.owner];
      if (Math.hypot(p.x - target.x, p.y - target.y) <= K.SHIP_R) {
        p.live = false;
        if (p.kind === 'beam') landBeam(p, target);
        else if (p.kind === 'entangle') landEntangle(p, target);
        else landMeasure(p, target);
      }
    }
    // ── Pickups: calibration (fidelity) and T-charges ─────────────────
    // Fixed cadence, alternating type, never random-rewarded (P6 bans
    // variable-ratio gambling) — you can plan for them.
    S.pickupTimer -= dt;
    if (S.pickupTimer <= 0 && S.pickups.length < 3) {
      S.pickupTimer = 9;
      const kind = (S.pickups.length + S.shotCount) % 2 === 0 ? 'calib' : 'tgate';
      let px, py, tries = 0;
      do {
        px = 120 + S.rand() * (K.WORLD_W - 240);
        py = 100 + S.rand() * (K.WORLD_H - 200);
        tries++;
      } while (DuelCore.zoneAt(px, py, S.zones) && tries < 12);
      S.pickups.push({ x: px, y: py, kind, t: 0 });
    }
    for (let i = S.pickups.length - 1; i >= 0; i--) {
      const pk = S.pickups[i];
      pk.t += dt;
      for (const sh of S.ships) {
        if (Math.hypot(pk.x - sh.x, pk.y - sh.y) > K.SHIP_R + 14) continue;
        if (pk.kind === 'calib') {
          sh.fidelity = Math.min(1, sh.fidelity + 0.15);
          floatTxt(sh, `FIDELITY ${(sh.fidelity*100)|0}%`, '#3fe08a');
          if (sh.owner === 0) tele('pickup', { kind: 'calibration', fidelity: +sh.fidelity.toFixed(2) });
        } else {
          sh.tCharges = Math.min(3, sh.tCharges + 1);
          floatTxt(sh, `T-CHARGE ×${sh.tCharges}`, '#f5b73c');
          if (sh.owner === 0) tele('pickup', { kind: 't_charge', held: sh.tCharges });
        }
        beep(660, 'triangle', 0.07, 0.14);
        S.pickups.splice(i, 1);
        break;
      }
    }
    // Floaters
    for (let i = S.floats.length - 1; i >= 0; i--) {
      const f = S.floats[i];
      f.y += f.vy; f.life -= dt;
      if (f.life <= 0) S.floats.splice(i, 1);
    }
    // Particles
    for (const q of S.parts) {
      if (!q.live) continue;
      q.x += q.vx * dt; q.y += q.vy * dt;
      q.vx *= 0.94; q.vy *= 0.94;
      q.life -= dt;
      if (q.life <= 0) q.live = false;
    }
  }

  let _droneT = 0, _droneDir = 1;
  function droneThink(foe, me, dt) {
    if (S.over) return;
    _droneT -= dt;
    // Drift perpendicular to the player, bouncing off the arena edges.
    foe.vy += _droneDir * 260 * dt;
    if (foe.y < 120 || foe.y > K.WORLD_H - 120) _droneDir *= -1;
    const dx = me.x - foe.x, dy = me.y - foe.y;
    const want = Math.atan2(dy, dx) + (S.rand() - 0.5) * 0.5;   // sloppy aim
    foe.ang = want;
    if (_droneT <= 0 && foe.beamCd === 0) {
      _droneT = 1.1 + S.rand() * 0.9;
      fireBeam(foe, DuelCore.chargeToTheta(0.4 + S.rand() * 0.8), 'X');
    }
    // Occasionally take a measure shot when the odds are decent.
    if (foe.measCd === 0 && foe.winding === 0 && DuelCore.odds(me.bloch) > 0.8 && S.rand() < 0.02) {
      foe.winding = K.MEASURE_WIND_S; sfxWind();
    }
  }

  // ── Frame: accumulate real time, sim in fixed steps, draw once ───────
  function frame(ts) {
    if (!S.active) return;
    if (S.last == null) S.last = ts;
    let dt = (ts - S.last) / 1000; S.last = ts;
    if (!(dt > 0)) dt = 1 / 60;
    dt = Math.min(dt, 0.25);                       // tab-return clamp
    const t0 = performance.now();
    if (!S.paused && !S.over) {
      S.acc += dt;
      let guard = 0;
      while (S.acc >= 1 / 60 && guard++ < 8) { step(1 / 60); S.acc -= 1 / 60; }
    }
    draw();
    const ms = performance.now() - t0;
    S.frameMs.push(ms); if (S.frameMs.length > 240) S.frameMs.shift();
  }

  function p95() {
    if (!S.frameMs.length) return 0;
    const a = S.frameMs.slice().sort((x, y) => x - y);
    return a[Math.min(a.length - 1, Math.floor(a.length * 0.95))];
  }

  // ── Draw ─────────────────────────────────────────────────────────────
  function draw() {
    ctx.clearRect(0, 0, BOARD, BOARD);
    // Letterbox bands (HUD lives here)
    ctx.fillStyle = '#05070f';
    ctx.fillRect(0, 0, BOARD, BAND);
    ctx.fillRect(0, BOARD - BAND, BOARD, BAND);
    ctx.save();
    ctx.beginPath(); ctx.rect(0, BAND, BOARD, VIEW_H); ctx.clip();

    drawStarfield();
    drawZones();
    drawPickups();

    // Projectiles
    for (const p of S.proj) {
      if (!p.live) continue;
      const x = w2sx(p.x), y = w2sy(p.y);
      if (p.kind === 'beam') {
        const len = 16 * SCALE * (0.6 + p.theta / Math.PI);
        const a = Math.atan2(p.vy, p.vx);
        ctx.strokeStyle = p.owner === 0 ? '#ff5a72' : '#ffa83c';
        ctx.lineWidth = Math.max(1.5, K.BEAM_W * SCALE * (0.5 + p.theta / Math.PI * 0.7));
        ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.moveTo(x - Math.cos(a) * len, y - Math.sin(a) * len);
        ctx.lineTo(x, y); ctx.stroke();
        ctx.shadowBlur = 0;
      } else {
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 14;
        ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(x, y, 9 + Math.sin(S.t * 20) * 2, 0, Math.PI * 2); ctx.stroke();
      }
    }
    // Particles
    for (const q of S.parts) {
      if (!q.live) continue;
      ctx.globalAlpha = Math.max(0, q.life / q.max);
      ctx.fillStyle = q.col;
      ctx.beginPath(); ctx.arc(w2sx(q.x), w2sy(q.y), q.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    S.ships.forEach(drawShip);
    drawEntangleLink();
    drawFloatsDuel();
    ctx.restore();
    drawHud();
    if (S.paused) banner('PAUSED', 'Esc to resume');
    if (S.over) {
      const won = S.round.winner === 0;
      const MM = DuelCore.DUEL_MISSIONS[S.mission];
      banner(won ? (MM ? 'MISSION CLEAR' : 'ROUND WON') : 'ROUND LOST',
             won && MM ? MM.win
                       : `MEASURE collapsed at P=${(S.round.p * 100).toFixed(0)}%  ·  R to rematch  ·  Esc for menu`,
             won && MM ? `P=${(S.round.p * 100).toFixed(0)}%  ·  R to replay  ·  Esc for mission list` : null);
    }
  }

  // Hotspots: a visibly noisy patch of chip. Read as terrain, not decoration.
  function drawZones() {
    for (const z of S.zones) {
      const x = w2sx(z.x), y = w2sy(z.y), r = z.r * SCALE;
      const g = ctx.createRadialGradient(x, y, r * 0.15, x, y, r);
      g.addColorStop(0, 'rgba(255,90,114,0.16)');
      g.addColorStop(0.7, 'rgba(255,90,114,0.07)');
      g.addColorStop(1, 'rgba(255,90,114,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = `rgba(255,90,114,${0.22 + 0.10 * Math.sin(S.t * 2)})`;
      ctx.lineWidth = 1.5; ctx.setLineDash([6, 6]);
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(255,140,155,0.55)';
      ctx.font = `700 ${Math.round(BOARD * 0.0138)}px ${CANVAS_BODY}`;
      ctx.textAlign = 'center';
      ctx.fillText('DECOHERENCE', x, y - 4);
      ctx.fillText('T₂ ' + DuelCore.ZONE.HOT_T2 + 's', x, y + 12);
      ctx.textAlign = 'left';
    }
  }

  function drawPickups() {
    for (const pk of S.pickups) {
      const x = w2sx(pk.x), y = w2sy(pk.y);
      const bob = Math.sin(pk.t * 3) * 3;
      const col = pk.kind === 'calib' ? '#3fe08a' : '#f5b73c';
      ctx.save(); ctx.translate(x, y + bob);
      ctx.strokeStyle = col; ctx.lineWidth = 2;
      ctx.shadowColor = col; ctx.shadowBlur = 12;
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2 + pk.t;
        const px = Math.cos(a) * 11, py = Math.sin(a) * 11;
        i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      ctx.closePath(); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = col;
      ctx.font = `700 ${Math.round(BOARD * 0.014)}px ${CANVAS_BODY}`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(pk.kind === 'calib' ? '⌖' : 'T', 0, 0);
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      ctx.restore();
    }
  }

  function drawFloatsDuel() {
    ctx.textAlign = 'center';
    for (const f of S.floats) {
      ctx.globalAlpha = Math.min(1, f.life);
      ctx.fillStyle = f.color;
      ctx.font = `700 ${Math.round(BOARD * 0.0163)}px ${CANVAS_BODY}`;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1; ctx.textAlign = 'left';
  }

  function drawStarfield() {
    // PD-10 — two procedural parallax layers; real nebula tiles are D2.
    for (const st of S.stars) {
      const px = (st.x - S.t * 14 * st.z) % K.WORLD_W;
      const x = w2sx(px < 0 ? px + K.WORLD_W : px), y = w2sy(st.y);
      ctx.globalAlpha = st.z === 0.8 ? 0.85 : 0.4;
      ctx.fillStyle = st.z === 0.8 ? '#cfd6ee' : '#7c8ce6';
      ctx.fillRect(x, y, st.r, st.r);
    }
    ctx.globalAlpha = 1;
  }

  function drawEntangleLink() {
    if (!S.bell) return;
    const [a, b] = S.ships;
    ctx.strokeStyle = `rgba(201,123,255,${0.5 + 0.25 * Math.sin(S.t * 8)})`;
    ctx.lineWidth = 2; ctx.setLineDash([8, 6]);
    ctx.beginPath();
    ctx.moveTo(w2sx(a.x), w2sy(a.y)); ctx.lineTo(w2sx(b.x), w2sy(b.y));
    ctx.stroke(); ctx.setLineDash([]);
  }

  function drawShip(sh) {
    const x = w2sx(sh.x), y = w2sy(sh.y), R = K.SHIP_R * SCALE;
    // Charge aura: how close this qubit is to |1⟩ (its own vulnerability).
    const od = DuelCore.odds(sh.bloch);
    if (od > 0.02) {
      const g = ctx.createRadialGradient(x, y, R * 0.3, x, y, R * 2.4);
      g.addColorStop(0, `rgba(255,90,114,${0.30 * od})`);
      g.addColorStop(1, 'rgba(255,90,114,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, R * 2.4, 0, Math.PI * 2); ctx.fill();
    }
    if (sh.shieldFlash > 0) {
      ctx.strokeStyle = `rgba(154,163,207,${sh.shieldFlash * 2})`;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(x, y, R * 1.5, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.save();
    ctx.translate(x, y); ctx.rotate(sh.ang);
    ctx.fillStyle = sh.hitFlash > 0 ? '#ffffff' : sh.col;
    ctx.shadowColor = sh.col; ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(R, 0); ctx.lineTo(-R * 0.7, R * 0.75);
    ctx.lineTo(-R * 0.35, 0); ctx.lineTo(-R * 0.7, -R * 0.75);
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();
    // Charging tell: a ring that fills toward the π-pulse.
    if (sh === S.ships[0] && S.charging) {
      const frac = Math.min(1, S.chargeT / K.CHARGE_FULL_S);
      ctx.strokeStyle = '#f5b73c'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(x, y, R * 1.7, -Math.PI / 2, -Math.PI / 2 + frac * Math.PI * 2);
      ctx.stroke();
    }
    if (sh.winding > 0) {
      const frac = 1 - sh.winding / K.MEASURE_WIND_S;
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.arc(x, y, R * 2.1 - frac * R, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // Interpolate the sphere along the great-circle arc of the rotation that
  // just landed, so the swing reads as the rotation it physically was.
  function shownBloch(sh) {
    if (!sh.arc) return sh.bloch;
    const t = Math.min(1, sh.arc.t), a = sh.arc.from, b = sh.arc.to;
    const ax = a.x*(1-t)+b.x*t, ay = a.y*(1-t)+b.y*t, az = a.z*(1-t)+b.z*t;
    const ma = Math.hypot(a.x,a.y,a.z), mb = Math.hypot(b.x,b.y,b.z);
    const want = ma*(1-t)+mb*t, cur = Math.hypot(ax,ay,az) || 1;
    const k = want / cur;                          // renormalize: arc, not chord
    return { x: ax*k, y: ay*k, z: az*k };
  }

  function drawHud() {
    const me = S.ships[0], foe = S.ships[1];
    // Opponent — top-left, with the live win-odds readout (§5).
    drawMiniSphere(ctx, 62, 74, 42, S.bell ? null : shownBloch(foe), foe.col, true);
    const od = S.bell ? DuelCore.bellOdds(S.bell, foe.bellIdx) : DuelCore.odds(foe.bloch);
    hudText('MEASURE ODDS', 118, 52, '#aeb8e6', 'var');
    ctx.font = `600 ${Math.round(BOARD * 0.045)}px 'Rajdhani','Space Grotesk',sans-serif`;
    ctx.fillStyle = od > 0.75 ? '#3fe08a' : od > 0.4 ? '#f5b73c' : '#ff5a72';
    ctx.textAlign = 'left';
    ctx.fillText(`${(od * 100).toFixed(0)}%`, 118, 92);
    hudText(S.bell ? 'ENTANGLED — one MEASURE collapses BOTH, correlated'
                   : 'their qubit — rotate it to |1⟩, then MEASURE',
            118, 112, S.bell ? '#c97bff' : '#6f79a8');
    if (foe.zenoUntil > S.t) hudText('ZENO-PINNED — cannot be rotated', 118, 130, '#8b7dff');
    else if (!S.bell && DuelCore.BEAMS[S.beam] && DuelCore.BEAMS[S.beam].kind === 'attack'
             && DuelCore.isEigenstate(foe.bloch, DuelCore.BEAMS[S.beam].axis))
      // Only when the camp actually blocks the beam you have SELECTED —
      // otherwise this fires on any cardinal state and reads as noise.
      hudText(`CAMPED against your ${S.beam}-beam — a T-phase (3) knocks them off`,
              118, 130, '#f5b73c');

    // Mission brief — the concept, stated once, where it is needed.
    const M = DuelCore.DUEL_MISSIONS[S.mission];
    if (M) {
      ctx.font = `700 ${Math.round(BOARD * 0.0175)}px ${CANVAS_BODY}`;
      ctx.fillStyle = '#f5b73c';
      ctx.fillText(`MISSION ${M.id + 1} · ${M.title}`, 118, 30);
      wrapHud(M.brief, 118, BAND + 22, BOARD - 150, '#8f9ac4');
      if (M.hurry) {
        const left = Math.max(0, M.hurry - S.t);
        ctx.textAlign = 'right';
        hudText(`T₁ WINDOW ${left.toFixed(1)}s`, BOARD - 16, 78,
                left < 6 ? '#ff5a72' : '#f5b73c');
        ctx.textAlign = 'left';
      }
    }
    // Gate feedback — why a collapse did not count.
    if (S.gateMsgT > 0 && S.gateMsg) {
      ctx.globalAlpha = Math.min(1, S.gateMsgT);
      const gy = BOARD - BAND - 54;
      ctx.fillStyle = 'rgba(5,7,15,0.88)';
      ctx.fillRect(60, gy - 20, BOARD - 120, 40);
      ctx.strokeStyle = '#9aa3cf'; ctx.lineWidth = 1;
      ctx.strokeRect(60, gy - 20, BOARD - 120, 40);
      ctx.textAlign = 'center';
      ctx.font = `700 ${Math.round(BOARD * 0.0163)}px ${CANVAS_BODY}`;
      ctx.fillStyle = '#cfd6ee';
      ctx.fillText(S.gateMsg.slice(0, 96), BOARD / 2, gy + 5);
      ctx.textAlign = 'left';
      ctx.globalAlpha = 1;
    }

    // Round pips — top-right (best-of-3 lands in D1; D0 shows one round).
    ctx.textAlign = 'right';
    hudText(S.over ? (S.round.winner === 0 ? 'ROUND: WON' : 'ROUND: LOST') : 'ROUND 1', BOARD - 16, 40, '#aeb8e6');
    hudText(`shots ${S.shotCount}   ${(S.t).toFixed(0)}s`, BOARD - 16, 60, '#6f79a8');
    if (S.showPerf) hudText(`p95 ${p95().toFixed(2)}ms`, BOARD - 16, 80, '#3fe08a');
    ctx.textAlign = 'left';

    // Player — bottom-left.
    const by = BOARD - BAND;
    drawMiniSphere(ctx, 62, by + 74, 42, S.bell ? null : shownBloch(me), me.col, true);
    hudText('YOUR QUBIT', 118, by + 34, '#aeb8e6');
    const myOdds = S.bell ? 0.5 : DuelCore.odds(me.bloch);
    hudText(`their odds on you: ${(myOdds * 100).toFixed(0)}%`
            + (me.inHot ? '   ·  IN HOTSPOT: discharging fast' : ''),
            118, by + 54, me.inHot ? '#3fe08a' : myOdds > 0.6 ? '#ff5a72' : '#6f79a8');

    // Charge bar with π-fraction ticks — the player reads pulse AREA.
    const bx = 118, bw = BOARD - 118 - 190, bh = 14, byy = by + 74;
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    roundRect(bx, byy, bw, bh, 3); ctx.fill();
    const frac = S.charging ? Math.min(1, S.chargeT / K.CHARGE_FULL_S) : 0;
    if (frac > 0) {
      ctx.fillStyle = frac >= 0.999 ? '#3fe08a' : '#f5b73c';
      roundRect(bx, byy, bw * frac, bh, 3); ctx.fill();
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1;
    [[0.25,'π/4'],[0.5,'π/2'],[0.75,'3π/4'],[1,'π']].forEach(([f, lab]) => {
      const tx = bx + bw * f;
      ctx.beginPath(); ctx.moveTo(tx, byy); ctx.lineTo(tx, byy + bh); ctx.stroke();
      ctx.textAlign = 'center';
      hudText(lab, tx, byy + bh + 15, '#6f79a8');
    });
    ctx.textAlign = 'left';
    hudText(S.charging ? 'RELEASE TO FIRE' : 'HOLD MOUSE / SPACE-FREE TO CHARGE X-BEAM',
            bx, byy - 6, S.charging ? '#f5b73c' : '#6f79a8');

    // Resource row: fidelity + T-charges + selected beam.
    const rx = 118, ry = byy + bh + 34;
    hudText('PULSE FIDELITY', rx, ry, '#6f79a8');
    ctx.font = `600 ${Math.round(BOARD * 0.020)}px 'Rajdhani','Space Grotesk',sans-serif`;
    ctx.fillStyle = me.fidelity > 0.85 ? '#3fe08a' : me.fidelity > 0.6 ? '#f5b73c' : '#ff5a72';
    ctx.fillText(`${(me.fidelity * 100) | 0}%`, rx + 105, ry + 1);
    hudText(`±${(DuelCore.sigmaFor(me.fidelity) * 180 / Math.PI).toFixed(0)}° aim`, rx + 150, ry, '#6f79a8');
    hudText('T-CHARGES', rx + 230, ry, '#6f79a8');
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = i < me.tCharges ? '#f5b73c' : 'rgba(255,255,255,0.12)';
      ctx.beginPath(); ctx.arc(rx + 305 + i * 15, ry - 4, 5, 0, Math.PI * 2); ctx.fill();
    }

    // Keycap strip — bottom-right, always visible (P3.6).
    const kx = BOARD - 214;
    const beamName = (DuelCore.BEAMS[S.beam] || {}).label || 'X-BEAM';
    hudText('WASD move · MOUSE aim + hold', kx, by + 30, '#6f79a8');
    ctx.fillStyle = (DuelCore.BEAMS[S.beam] || {}).color || '#ff5a72';
    ctx.font = `700 ${Math.round(BOARD * 0.0163)}px ${CANVAS_BODY}`;
    ctx.fillText(`1/2/3  ${beamName}${S.beam === 'T' ? ' ×' + me.tCharges : ''}`, kx, by + 48);
    const measReady = me.measCd === 0 && me.winding === 0;
    hudText(`SPACE  MEASURE ${measReady ? '(ready)' : '(' + me.measCd.toFixed(1) + 's)'}`,
            kx, by + 66, measReady ? '#3fe08a' : '#6f79a8');
    const entReady = !S.bell && (me.entCd || 0) <= 0;
    hudText(`E  ENTANGLE ${S.bell ? '(linked)' : entReady ? '(ready)' : '(' + (me.entCd||0).toFixed(0) + 's)'}`,
            kx, by + 84, S.bell ? '#c97bff' : entReady ? '#c97bff' : '#6f79a8');
    hudText('ESC  pause · menu', kx, by + 102, '#6f79a8');
  }

  // Tiny word-wrapper for the mission brief (the one place duel HUD has prose).
  function wrapHud(txt, x, y, maxW, col) {
    ctx.font = `500 ${Math.round(BOARD * 0.0155)}px ${CANVAS_BODY}`;
    ctx.fillStyle = col;
    const words = txt.split(' ');
    let line = '', ly = y;
    for (const w of words) {
      const test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width > maxW && line) {
        ctx.fillText(line, x, ly); line = w; ly += Math.round(BOARD * 0.021);
      } else line = test;
    }
    if (line) ctx.fillText(line, x, ly);
  }

  function hudText(txt, x, y, col) {
    ctx.font = `600 ${Math.round(BOARD * 0.0163)}px ${CANVAS_BODY}`;
    ctx.fillStyle = col || '#aeb8e6';
    ctx.fillText(txt, x, y);
  }

  function banner(title, sub, sub2) {
    ctx.fillStyle = 'rgba(5,7,15,0.72)';
    ctx.fillRect(0, BAND, BOARD, VIEW_H);
    ctx.textAlign = 'center';
    ctx.font = `bold ${canvasFontPx(20, 17)}px 'Press Start 2P',monospace`;
    ctx.fillStyle = '#8b7dff';
    ctx.fillText(title, BOARD / 2, BOARD * 0.46);
    ctx.font = `600 ${Math.round(BOARD * 0.019)}px ${CANVAS_BODY}`;
    ctx.fillStyle = '#cfd6ee';
    ctx.fillText(sub, BOARD / 2, BOARD * 0.52);
    if (sub2) {
      ctx.font = `500 ${Math.round(BOARD * 0.017)}px ${CANVAS_BODY}`;
      ctx.fillStyle = '#8f9ac4';
      ctx.fillText(sub2, BOARD / 2, BOARD * 0.57);
    }
    ctx.textAlign = 'left';
  }

  // ── Input ────────────────────────────────────────────────────────────
  function onKey(e, down) {
    if (MODE !== 'duel') return;
    const k = e.key.toLowerCase();
    if (down && k === 'escape') {
      if (S.over) { exitDuel(S.mission >= 0); }
      else S.paused = !S.paused;
      e.preventDefault(); return;
    }
    if (down && k === 'r' && S.over) { start(S.seed, S.mission); e.preventDefault(); return; }
    // Beam select — 1 X (attack), 2 Y (attack), 3 T (phase, scarce).
    if (down && (k === '1' || k === '2' || k === '3')) {
      S.beam = { '1':'X', '2':'Y', '3':'T' }[k];
      beep(520, 'triangle', 0.05, 0.10); e.preventDefault(); return;
    }
    // E — entangle beam: the comeback move (see DuelCore's Bell notes).
    if (down && k === 'e' && !S.paused && !S.over) {
      const me = S.ships[0];
      if (!S.bell && (me.entCd || 0) <= 0) {
        const q = take(S.proj);
        if (q) {
          q.live = true; q.kind = 'entangle'; q.owner = 0; q.ttl = 4;
          q.x = me.x + Math.cos(me.ang) * K.SHIP_R;
          q.y = me.y + Math.sin(me.ang) * K.SHIP_R;
          q.vx = Math.cos(me.ang) * 520; q.vy = Math.sin(me.ang) * 520;
          me.entCd = 12;
          sweep(300, 700, 0.2, 'sine', 0.14);
        }
      }
      e.preventDefault(); return;
    }
    if (k === ' ') {
      if (down && !S.paused && !S.over) {
        const me = S.ships[0];
        if (me.measCd === 0 && me.winding === 0) { me.winding = K.MEASURE_WIND_S; sfxWind(); }
      }
      e.preventDefault(); return;
    }
    S.keys[k] = down;
    if (['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k))
      e.preventDefault();
  }

  function onMouseMove(e) {
    if (MODE !== 'duel') return;
    const rect = canvas.getBoundingClientRect();
    const cx = (e.clientX - rect.left) * (BOARD / rect.width);
    const cy = (e.clientY - rect.top) * (BOARD / rect.height);
    S.aim.x = cx / SCALE;
    S.aim.y = (cy - BAND) / SCALE;
  }
  function onMouseDown(e) {
    if (MODE !== 'duel' || S.paused || S.over) return;
    ac();                                          // unlock audio on gesture
    S.charging = true; S.chargeT = 0; e.preventDefault();
  }
  function onMouseUp(e) {
    if (MODE !== 'duel' || !S.charging) return;
    S.charging = false;
    const me = S.ships[0];
    if (!S.paused && !S.over && me.beamCd === 0)
      fireBeam(me, DuelCore.chargeToTheta(S.chargeT), S.beam);
    S.chargeT = 0; e.preventDefault();
  }

  return { start, stop, frame, onKey, onMouseMove, onMouseDown, onMouseUp,
           state: S, p95, telemetry: () => S.tele.slice(),
           togglePerf: () => (S.showPerf = !S.showPerf) };
})();
